# Gitleaks configuration for Spur
# Prevents accidental commits of secrets, API keys, tokens, etc.

title = "Spur Secret Scanning"

# Use all default gitleaks rules
[extend]
useDefault = true

# Allowlist to ignore false positives
[allowlist]
description = "Allowlisted patterns"

paths = [
  "node_modules/",
  "dist/",
  ".next/",
  "coverage/",
  "pnpm-lock.yaml",
]

regexes = [
  # Environment variable references
  "\\$\\{[A-Z_]+\\}",

  # Placeholder values
  "your-api-key-here",
  "your-token-here",
  "example\\.com",

  # RFC 6455 example WebSocket handshake nonce (public by protocol, not a secret;
  # appears in the clean-install-test skill's /ws probe across branch history)
  "dGhlIHNhbXBsZSBub25jZQ==",
]
