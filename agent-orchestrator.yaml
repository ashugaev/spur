# Agent Orchestrator — self-hosting config (dog-fooding)

port: 5050
dataDir: ~/.ao-sessions
worktreeDir: ~/.worktrees/ao

defaults:
  runtime: tmux
  agent: claude-code
  workspace: worktree
  notifiers: [desktop]

projects:
  ao:
    name: Agent Orchestrator
    repo: ComposioHQ/agent-orchestrator
    path: ~/agent-orchestrator
    defaultBranch: main
    sessionPrefix: ao
    scm:
      plugin: github
    tracker:
      plugin: linear
      teamId: "2a6e9b1b-19cd-4e30-b5bd-7b34dc491c7e"
    symlinks: [.claude, AGENTS.md, CLAUDE.md, .codex, .agents]
    postCreate:
      - "pnpm install"
    agentConfig:
      permissions: skip

  int:
    name: Intelas Web
    repo: intelas/intelas-web
    path: ~/projects/intelas-web-2
    defaultBranch: dev
    sessionPrefix: intelas
    scm:
      plugin: github
    tracker:
      plugin: jira
    symlinks: [.claude, AGENTS.md, CLAUDE.md, .codex, .agents, node_modules]
    agentRulesFile: dev/.ao-agent-rules.md
    agentConfig:
      permissions: skip
