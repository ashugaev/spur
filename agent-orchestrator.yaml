# Agent Orchestrator — self-hosting config (dog-fooding)

port: 5050
dataDir: ~/.ao-sessions
worktreeDir: ~/.worktrees/ao

remote:
  tailscaleHost: auto

defaults:
  runtime: tmux
  agent: claude-code
  workspace: worktree
  notifiers: [desktop, telegram]

notifiers:
  telegram:
    plugin: telegram
    pollingIntervalMs: 2000
    defaultSessionId: ao-orchestrator

services:
  transcriber:
    binaryPath: /opt/homebrew/bin/whisper-cli
    modelPath: "/Users/alek/Library/Application Support/com.meetily.ai/models/ggml-large-v3-turbo.bin"

notificationRouting:
  urgent: [desktop, telegram]
  action: [desktop, telegram]
  warning: [desktop, telegram]
  info: [telegram]

reactions:
  ci-failed:
    auto: true
    action: send-to-agent
    retries: 3
    escalateAfter: 3
  changes-requested:
    auto: true
    action: send-to-agent
    escalateAfter: 30m
  review-comments:
    auto: true
    action: send-to-agent
    escalateAfter: 30m
  merge-conflicts:
    auto: true
    action: send-to-agent
    message: "Your PR has merge conflicts. Merge the default branch into your branch, resolve conflicts, run tests, and push. Do not rebase. Do not force push."
    escalateAfter: 15m
  approved-and-green:
    auto: true
    action: auto-merge
    mergeMethod: merge
    priority: action

projects:
  ao:
    name: Agent Orchestrator
    repo: ashugaev/ao
    path: ~/projects/agent-orchestrator
    defaultBranch: main
    sessionPrefix: ao
    scm:
      plugin: github
    tracker:
      plugin: github
    symlinks: [.claude, AGENTS.md, CLAUDE.md, .codex, .agents,  node_modules]
    agentRulesFile: .ao-agent-rules.md
    postCreate:
      - "pnpm install"
    agentConfig:
      permissions: skip

