  int:
    name: Intelas Web
    repo: intelas/intelas-web
    path: ~/projects/intelas-web-2
    defaultBranch: dev
    sessionPrefix: intelas
    scm:
      plugin: github
      prDraft: true
    reactions:
      approved-and-green:
        auto: false
    tracker:
      plugin: jira
      projectKey: WEBDEV
      ignoreStatuses:
        - "On Hold"
      statusMapping:
        Backlog: open
        "In Progress": in_progress
        "In Review": in_progress
        "Code Review": in_progress
        "In Dev": closed
        "In Prod": closed
        Done: closed
    listeners:
      jira-broai:
        source: tracker-task
        mode: observe
        intervalMs: 300000
        filters:
          iteration: current
          assignee: "aleksey@intelas.com"
    symlinks: [.claude, AGENTS.md, CLAUDE.md, .codex, .agents, node_modules]
    agentRulesFile: dev/.ao-agent-rules.md
    agentConfig:
      permissions: skip
