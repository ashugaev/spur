name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --dir packages/web build
      - name: Bundle web into v2
        run: bash scripts/bundle-web.sh
      - name: Verify packed tarball contents
        run: |
          cd v2
          tgz="$(npm pack --pack-destination "$RUNNER_TEMP" 2>/dev/null | tail -1)"
          tgz="$RUNNER_TEMP/$tgz"
          bash "$GITHUB_WORKSPACE/scripts/verify-package-tarball.sh" "$tgz"
          arch="$(node -p process.arch)"
          tar -tzf "$tgz" | grep -q "package/web/node_modules/node-pty/prebuilds/linux-$arch/pty.node" || {
            echo "packed tarball is missing node-pty/prebuilds/linux-$arch/pty.node"
            exit 1
          }
          tar -tvzf "$tgz" | grep " package/skills/spur/SKILL.md$" | grep -q "^-" || {
            echo "packed tarball has package/skills/spur/SKILL.md as a non-regular file"
            exit 1
          }
      - name: Verify bundled web boots
        run: node scripts/verify-bundled-web.mjs v2/web/dist-server/web-server.js
      - name: Build v2
        env:
          SPUR_DISABLE_AUTOSTART: "1"
        run: pnpm --dir v2 build
      - name: Test v2
        run: pnpm --dir v2 test
      - name: Release
        # Run from the repo root: .releaserc.json paths (prepareCmd, pkgRoot)
        # are root-relative.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPUR_DISABLE_AUTOSTART: "1"
        run: npx -p semantic-release@24 -p @semantic-release/exec -- semantic-release
