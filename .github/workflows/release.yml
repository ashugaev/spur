name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-go@v6
        with:
          go-version-file: companion/auth-proxy/go.mod
          cache-dependency-path: companion/auth-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --dir packages/web build
      - name: Bundle web into v2
        run: bash scripts/bundle-web.sh
      - name: Verify packed tarball contents
        run: bash scripts/pack-release.sh "$RUNNER_TEMP"
      - name: Verify bundled web boots
        run: node scripts/verify-bundled-web.mjs v2/web/dist-server/web-server.js
      - name: Build v2
        env:
          SPUR_DISABLE_AUTOSTART: "1"
        run: pnpm --dir v2 build
      - name: Test v2
        run: pnpm --dir v2 test
      - name: Test managed account proxy
        run: go -C companion/auth-proxy test -p 2 ./...
      - name: Release
        # Run from the repo root: .releaserc.json paths (prepareCmd, pkgRoot)
        # are root-relative.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPUR_DISABLE_AUTOSTART: "1"
        run: npx -p semantic-release@24 -p @semantic-release/exec -- semantic-release
