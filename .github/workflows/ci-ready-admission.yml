name: Ready-class admission

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  admission:
    name: Admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Admit real runner work
        uses: actions/github-script@v8
        env:
          ADMISSION_STAGE: ${{ inputs.stage }}
          ADMISSION_TOKEN: ${{ github.token }}
          SPUR_CODE_REVIEW_ACTOR: ${{ vars.SPUR_CODE_REVIEW_ACTOR }}
          SPUR_BROWSER_REVIEW_ACTOR: ${{ vars.SPUR_BROWSER_REVIEW_ACTOR }}
        with:
          script: |
            const started = performance.now();
            // Bootstrap needs its bound before fetching the trusted stage table.
            const allocations = {
              quality: 150, playwright: 150, 'runtime-integration': 150,
              'real-agent-smoke': 150, gitleaks: 300, 'npm-audit': 300,
              'onboarding-test': 600,
            };
            const stage = process.env.ADMISSION_STAGE;
            const allocation = allocations[stage];
            let outcome = { admitted: true, classification: 'ordinary', reason: 'degraded-bootstrap', stage };
            let directory;
            let requests = 0;
            const remaining = () => Math.max(0, started + (allocation ?? 0) * 1000 - performance.now());
            const request = async (path, raw = false) => {
              if (!remaining() || ++requests > 96) throw new Error('bootstrap-budget-exhausted');
              const response = await fetch(`https://api.github.com${path}`, {
                method: 'GET',
                headers: {
                  Authorization: `Bearer ${process.env.ADMISSION_TOKEN}`,
                  Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                redirect: 'error',
                signal: AbortSignal.timeout(Math.max(1, Math.floor(Math.min(10000, remaining())))),
              });
              if (!response.ok) throw new Error(`bootstrap-read-${response.status}`);
              const body = await response.text();
              if (!remaining() || Buffer.byteLength(body) > 4 * 1024 * 1024) throw new Error('bootstrap-budget-exhausted');
              return raw ? body : JSON.parse(body);
            };
            try {
              if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
                outcome = { admitted: true, classification: 'bypass', reason: 'non-pull-request', stage };
              } else if (allocation) {
                const repository = process.env.GITHUB_REPOSITORY;
                if (!/^[\w.-]+\/[\w.-]+$/.test(repository)) throw new Error('invalid-repository');
                const prefix = `/repos/${repository}`;
                const repo = await request(prefix);
                const commit = await request(`${prefix}/commits/${encodeURIComponent(repo.default_branch)}`);
                if (!/^[a-f0-9]{40}$/.test(commit.sha)) throw new Error('invalid-default-source');
                const source = await request(`${prefix}/contents/scripts/ci-ready-admission.mjs?ref=${commit.sha}`, true);
                const policyText = await request(`${prefix}/contents/.github/ci-ready-admission-policy.json?ref=${commit.sha}`, true);
                const policy = JSON.parse(policyText);
                if (policy.version !== 1 || policy.repository !== repository) throw new Error('invalid-trusted-policy');
                const { mkdtemp, writeFile } = require('node:fs/promises');
                const { tmpdir } = require('node:os');
                const { join } = require('node:path');
                const { pathToFileURL } = require('node:url');
                directory = await mkdtemp(join(tmpdir(), 'spur-admission-'));
                const executable = join(directory, 'ci-ready-admission.mjs');
                await writeFile(executable, source, { flag: 'wx' });
                if (!remaining()) throw new Error('bootstrap-budget-exhausted');
                const controller = await import(pathToFileURL(executable).href);
                outcome = await controller.runAdmission({
                  repository, policy, sourceSha: commit.sha, defaultBranch: repo.default_branch,
                  stage, runId: Number(process.env.GITHUB_RUN_ID),
                  attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                  eventName: process.env.GITHUB_EVENT_NAME, event: context.payload,
                  codeActor: Number(process.env.SPUR_CODE_REVIEW_ACTOR),
                  browserActor: Number(process.env.SPUR_BROWSER_REVIEW_ACTOR),
                  token: process.env.ADMISSION_TOKEN, remainingMs: remaining(), setupRequests: requests,
                });
              } else {
                outcome.reason = 'unknown-stage';
              }
            } catch (error) {
              outcome.detail = error instanceof Error ? error.message : 'unknown-bootstrap-error';
            } finally {
              if (directory) {
                try {
                  await require('node:fs/promises').rm(directory, { recursive: true, force: true });
                } catch {
                  core.warning('Admission temporary source cleanup failed');
                }
              }
            }
            outcome.totalElapsedMs = Math.max(0, performance.now() - started);
            core.setOutput('classification', outcome.classification);
            core.setOutput('reason', outcome.reason);
            core.info(JSON.stringify(outcome));
            await core.summary.addHeading('Runner admission').addCodeBlock(JSON.stringify(outcome, null, 2), 'json').write();
