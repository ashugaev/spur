name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/pnpm-setup
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:deploy
      - run: bash v2/test/npm-init.test.sh
      - run: bash v2/test/install-and-restart.test.sh

  playwright:
    name: Playwright E2E
    runs-on: self-hosted
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/pnpm-setup
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/web exec playwright install chromium
      - run: pnpm --dir packages/web build
      # playwright.config.ts owns the Next server and its port: its webServer
      # block starts `next start` against an isolated, unbound daemon target.
      - run: pnpm --dir packages/web exec playwright test

  runtime-integration:
    name: Runtime Integration
    runs-on: self-hosted
    needs: playwright
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/pnpm-setup
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start tmux server
        run: tmux start-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir v2 build
      - run: pnpm --dir v2 exec vitest run --config vitest.runtime.config.ts --reporter=verbose

  real-agent-smoke:
    name: Real-Agent Smoke
    runs-on: self-hosted
    needs: runtime-integration
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/pnpm-setup
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start tmux server
        run: tmux start-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir v2 build
      - run: pnpm --dir v2 test:smoke
