name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to catch new vulnerabilities
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --log-level warn

  npm-audit:
    name: NPM Audit
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # npm retired the legacy v1 audit endpoint (HTTP 410) and current
      # `pnpm audit` still queries it, so the check can no longer run.
      # `osv-scanner` reads `pnpm-lock.yaml` directly and sources advisories
      # from the OSV database — no dependency on the retired endpoint.
      - name: Run osv-scanner on the pnpm lockfile
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
