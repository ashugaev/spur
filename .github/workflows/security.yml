name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to catch new vulnerabilities
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        # Scope to the current branch's history (HEAD ancestry) only. Default
        # detect scans every ref in the clone; on the reused self-hosted runner
        # that pulls in unrelated stale branches and their commits.
        run: gitleaks detect --source . --log-opts=HEAD --redact --log-level warn

  npm-audit:
    name: NPM Audit
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true # Don't fail build on vulnerabilities in deps

      - name: Run pnpm audit (strict)
        run: pnpm audit --prod --audit-level=high
        # pnpm still calls the retired npm /v1/security/audits endpoint
        # (410 Gone). Dependabot already scans the default branch, so we
        # surface this step as a soft signal until pnpm migrates to the
        # bulk advisory endpoint.
        continue-on-error: true
