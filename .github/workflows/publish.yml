name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install pnpm
        run: npm install -g pnpm@9.15.4
      - run: pnpm install --frozen-lockfile
      - name: Prepare v2/package.json for publish
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const v2Pkg = JSON.parse(fs.readFileSync("v2/package.json", "utf8"));
            const tagVersion = process.env.GITHUB_REF_NAME.slice(1);
            if (rootPkg.version !== tagVersion) {
              console.error("Root package.json version", rootPkg.version, "does not match tag version", tagVersion);
              process.exit(1);
            }
            v2Pkg.version = rootPkg.version;
            delete v2Pkg.private;
            fs.writeFileSync("v2/package.json", JSON.stringify(v2Pkg, null, 2) + "\n");
          '
      - run: pnpm --dir v2 build
      - name: Publish
        working-directory: v2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
