name: Onboarding Integration Test

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/web/**"
      - "scripts/setup.sh"
      - "tests/integration/**"
      - "v2/**"
      - "README.md"
      - "docs/**"
      - "SETUP.md"
      - "TROUBLESHOOTING.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/onboarding-test.yml"
  push:
    branches:
      - main

jobs:
  onboarding-test:
    name: Test Fresh Onboarding
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: onboarding-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # Runs first, and before checkout, because a full runner disk fails this job
      # long before the build step. Scoped to this workflow's own leak: the images
      # tagged after COMPOSE_PROJECT_NAME that Cleanup left behind until --rmi local.
      - name: Reclaim leaked onboarding images
        continue-on-error: true
        run: |
          set +e
          echo "=== disk before reclaim ==="
          df -h /
          docker system df
          IN_USE="$(docker ps -a --format '{{.Image}}')"
          LEAKED=""
          for REF in $(docker image ls --format '{{.Repository}}:{{.Tag}}'); do
            case "$REF" in
              onboarding-*) ;;
              *) continue ;;
            esac
            # Never touch this run's own image, nor one a concurrent run still uses.
            case "$REF" in
              "$COMPOSE_PROJECT_NAME"*) continue ;;
            esac
            if printf '%s\n' "$IN_USE" | grep -qxF -e "$REF" -e "${REF%:latest}"; then
              continue
            fi
            LEAKED="$LEAKED $REF"
          done
          if [ -n "$LEAKED" ]; then
            echo "removing leaked images:$LEAKED"
            docker rmi -f $LEAKED
          else
            echo "no leaked onboarding-* images"
          fi
          docker builder prune -af --filter until=24h
          echo "=== disk after reclaim ==="
          df -h /
          docker system df

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        working-directory: tests/integration
        run: docker compose build

      - name: Run onboarding test
        id: test
        working-directory: tests/integration
        run: |
          docker compose up -d onboarding-test
          CONTAINER_ID="$(docker compose ps -q onboarding-test)"
          if [ -z "$CONTAINER_ID" ]; then
            echo "Failed to resolve onboarding-test container ID" >&2
            docker compose ps
            exit 1
          fi
          docker logs -f "$CONTAINER_ID" &
          LOGS_PID=$!
          EXIT_CODE="$(docker wait "$CONTAINER_ID")"
          wait "$LOGS_PID" || true
          exit "$EXIT_CODE"

      - name: Extract metrics
        if: always()
        working-directory: tests/integration
        run: |
          # Extract onboarding time from container logs
          docker compose logs onboarding-test 2>&1 | grep "Total onboarding time" || echo "Metrics not available"

      - name: Cleanup
        if: always()
        working-directory: tests/integration
        run: docker compose down -v --rmi local --remove-orphans

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-test-logs
          path: |
            tests/integration/*.log
          retention-days: 7
