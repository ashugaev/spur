name: Onboarding Integration Test

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/web/**"
      - "scripts/setup.sh"
      - "tests/integration/**"
      - "v2/**"
      - ".github/workflows/onboarding-test.yml"
  push:
    branches:
      - main

jobs:
  onboarding-test:
    name: Test Fresh Onboarding
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: onboarding-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        working-directory: tests/integration
        run: docker compose build

      - name: Run onboarding test
        id: test
        working-directory: tests/integration
        run: |
          docker compose up -d onboarding-test
          CONTAINER_ID="$(docker compose ps -q onboarding-test)"
          if [ -z "$CONTAINER_ID" ]; then
            echo "Failed to resolve onboarding-test container ID" >&2
            docker compose ps
            exit 1
          fi
          docker logs -f "$CONTAINER_ID" &
          LOGS_PID=$!
          EXIT_CODE="$(docker wait "$CONTAINER_ID")"
          wait "$LOGS_PID" || true
          exit "$EXIT_CODE"

      - name: Extract metrics
        if: always()
        working-directory: tests/integration
        run: |
          # Extract onboarding time from container logs
          docker compose logs onboarding-test 2>&1 | grep "Total onboarding time" || echo "Metrics not available"

      - name: Cleanup
        if: always()
        working-directory: tests/integration
        run: docker compose down -v --remove-orphans

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-test-logs
          path: |
            tests/integration/*.log
          retention-days: 7
