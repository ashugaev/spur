# Tags are read only from the instance/bootstrap config (~/.spur/config.yaml or
# $SPUR_CONFIG). A `tags:` block here is parsed but discarded by project merge —
# no runtime effect. Kept as documentation of the catalog shape.
# Each tag's `description` is the sole agent-facing instruction: state any
# condition (e.g. "set only on the user's direct request") in the description.
# tags:
#   review:
#     description: Reviewing a PR or existing code, not writing implementation. Set when the session's whole job is code review.
#     color: "#58a6ff"
#   focus:
#     description: What you are working on today or keeping attention on right now. Set only on the user's direct request — never on spawn or autospawn.
#     color: "#FFD700"

projects:
  sp:
    path: ~/projects/spur
    defaultBranch: main
    sessionPrefix: spur
    symlinks:
      - .env
      - node_modules
      - v2/node_modules
    branchNaming:
      regex: "^feature/[a-z]+(-[a-z]+){0,3}$"
    workspaceAccess:
      items:
        - label: Cursor
          kind: copy
          value: "cursor --remote ssh-remote+${SPUR_SIDECAR_PUBLIC_HOST} ${worktreePathShell}"
        - label: Web IDE
          kind: link
          value: "${SPUR_VSCODE_WEB_URL}/?folder=${worktreePathUrl}"
    codexArgs:
      - -c
      - 'model_reasoning_effort="high"'
      - -c
      - 'service_tier="fast"'
      - --enable
      - fast_mode
    preflight: {}
    sidecars:
      isolated-daemon:
        command: ./scripts/spur-isolated-daemon.sh
        autoStart: true
        ports:
          daemon:
            env: SPUR_RESERVED_PORT_DAEMON
            start: 4320
            end: 4399
      isolated-ui:
        command: ./scripts/spur-isolated-ui.sh
        autoStart: true
        ports:
          ui:
            env: SPUR_RESERVED_PORT_UI
            start: 5600
            end: 5699
            url: SPUR_SIDECAR_PUBLIC_URL
          terminal:
            env: SPUR_RESERVED_PORT_TERMINAL
            start: 15600
            end: 15699
        env:
          SPUR_SIDECAR_PUBLIC_HOST: SPUR_SIDECAR_PUBLIC_HOST
          SPUR_SIDECAR_PUBLIC_URL: SPUR_SIDECAR_PUBLIC_URL
    spawn:
      steps:
        - "run $manager"
    sources:
      gh:
        type: github
      gh-pr-review:
        type: github
        intervalMs: 600000
        runOnStart: false
        emitExisting: true
        query: "repo:ashugaev/spur"
    triggers:
      gh-changes-requested:
        source: gh
        event: github:changes_requested
        send:
          prompt: "Run $manager and $github. Address the latest requested review changes on the active PR."
      gh-ci-failed:
        source: gh
        event: github:ci_failed
        send:
          prompt: "Run $manager and $github. Check failing CI on the active PR, fix it, rerun relevant checks, then push."
      gh-comment:
        source: gh
        event: github:comment
        send:
          prompt: "/pr-comments-fix"
      gh-merge-conflict:
        source: gh
        event: github:merge_conflict
        send:
          prompt: "поправь конфликты и подпуш свежую ветку к себе и подпуш все."
      gh-pr-review-spawn:
        source: gh-pr-review
        event: github:work_item.new
        spawn:
          restrictWrites: true
          allowedTriggers: []
          agent: claude
          prompt: |
            Run /code-review {{url}}.
            Tag this session with `"$SPUR_SLOT_COMMAND" --tag review`.
            Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, and merge state for {{url}}."
          selfDestruct:
            enabled: true
            conditions: "PR is merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
          overrides:
            worktree: false
      # PR lifecycle events on a github source:
      #   github:ready_for_review - PR left draft state
      #   github:approved         - an approving review (once per reviewer)
      #   github:merged           - PR merged
      #   github:closed           - PR closed without merging
      # Terminal events (merged/closed) fire only while the owning session still runs.
      gh-ready-for-review:
        source: gh
        event: github:ready_for_review
        send:
          prompt: "Run $manager and $github. The active PR is ready for review."
