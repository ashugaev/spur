projects:
  sp:
    path: .
    defaultBranch: main
    sessionPrefix: spur
    symlinks: [node_modules, .env]
    preflight: {}
    sidecars:
      isolated-daemon:
        command: ./scripts/spur-isolated-daemon.sh
        autoStart: true
        ports:
          daemon:
            env: SPUR_RESERVED_PORT_DAEMON
            start: 4320
            end: 4399
      isolated-ui:
        command: ./scripts/spur-isolated-ui.sh
        autoStart: true
        ports:
          ui:
            env: SPUR_RESERVED_PORT_UI
            start: 5600
            end: 5699
          terminal:
            env: SPUR_RESERVED_PORT_TERMINAL
            start: 15600
            end: 15699
        env:
          SPUR_SIDECAR_PUBLIC_HOST: openclaw-dev.tail90e846.ts.net
          SPUR_SIDECAR_PUBLIC_SCHEME: http
    spawn:
      steps:
        - "run $manager"
    sources:
      gh:
        type: github
    triggers:
      gh-changes-requested:
        source: gh
        event: github:changes_requested
        send:
          prompt: "Run $manager and $github. Address the latest requested review changes on the active PR."
      gh-ci-failed:
        source: gh
        event: github:ci_failed
        send:
          prompt: "Run $manager and $github. Check failing CI on the active PR, fix it, rerun relevant checks, then push."
      gh-comment:
        source: gh
        event: github:comment
        send:
          prompt: "Run $manager and $github. Review the latest PR comments on the active PR and address them."
      gh-merge-conflict:
        source: gh
        event: github:merge_conflict
        send:
          prompt: "поправь конфликты и подпуш свежую ветку к себе и подпуш все."
