projects:
  probe:
    path: /tmp/claude-1001/-home-alek--spur-worktrees-sp-spur-328b/8a317425-937b-4a3a-aac3-9b66c7d38882/scratchpad/fixture
    defaultBranch: feature/conflict-probe-head
    sessionPrefix: probe
    defaultAgent: claude
    defaultModels:
      claude: haiku
    sources:
      gh:
        type: github
        intervalMs: 20000
    triggers:
      probe-ci:
        source: gh
        event: github:ci_failed
        send:
          prompt: "Probe ping: ci failed. Reply with one word: ack. Do nothing else."
      probe-conflict:
        source: gh
        event: github:merge_conflict
        send:
          prompt: "Probe ping: merge conflict. Reply with one word: ack. Do nothing else."
