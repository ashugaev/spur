server:
  host: 127.0.0.1
  port: 4311

dataDir: ~/.spur/spur-repo/local-test
worktreeDir: ~/.spur/spur-repo/local-test-worktrees
defaultAgent: codex

projects:
  spur-local:
    path: /Users/alek/projects/agent-orchestrator
    defaultBranch: main
    sessionPrefix: spur
    symlinks: []
    sources:
      local-cron:
        type: cron
        schedule: "0 0 1 1 *"
        # Intentionally omitted:
        # runOnStart defaults to false.
      gh:
        type: github
    triggers:
      local-cron-spawn:
        source: local-cron
        event: cron:tick
        spawn:
          agent: claude
          prompt: "Review this repo and continue the highest-priority task."
      gh-changes-requested:
        source: gh
        event: github:changes_requested
        send: {}
      # gh-ci-failed:
      #   source: gh
      #   event: github:ci_failed
      #   send:
      #     interrupt: true
      gh-comment:
        source: gh
        event: github:comment
        send: {}
