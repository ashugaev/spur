server:
  host: 127.0.0.1
  port: 4311

defaultAgent: codex

projects:
  sp:
    path: .
    defaultBranch: main
    sessionPrefix: spur
    symlinks: [node_modules, .env]
    sources:
      gh:
        type: github
    triggers:
      gh-changes-requested:
        source: gh
        event: github:changes_requested
        send: {}
      gh-changes-requested-spawn:
        source: gh
        event: github:changes_requested
        spawn:
          prompt: "Run $manager and $github. Address the latest requested review changes on the active PR."
          steps:
            - "run reviewer agent on the current diff"
            - "run $code-simplifier"
            - "run $self-verify"
      # gh-ci-failed:
      #   source: gh
      #   event: github:ci_failed
      #   send:
      #     interrupt: true
      gh-comment:
        source: gh
        event: github:comment
        send: {}
