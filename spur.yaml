projects:
  sp:
    path: ~/projects/spur
    defaultBranch: main
    sessionPrefix: spur
    defaultAgent: claude
    defaultModels:
      claude: sonnet
      cursor: auto
    defaultEfforts:
      cursor: max
    symlinks:
      - .env
      - node_modules
      - v2/node_modules
    branchNaming:
      regex: "^feature/[a-z]+(-[a-z]+){0,3}$"
    workspaceAccess:
      items:
        - label: Cursor
          kind: copy
          value: "cursor --remote ssh-remote+${SPUR_SIDECAR_PUBLIC_HOST} ${worktreePathShell}"
        - label: Web IDE
          kind: link
          value: "${SPUR_VSCODE_WEB_URL}/?folder=${worktreePathUrl}"
    codexArgs:
      - -c
      - 'model_reasoning_effort="high"'
      - -c
      - 'service_tier="fast"'
      - --enable
      - fast_mode
    preflight: {}
    sidecars:
      isolated-daemon:
        command: ./scripts/spur-isolated-daemon.sh
        autoStart: true
        ports:
          daemon:
            env: SPUR_RESERVED_PORT_DAEMON
            start: 4320
            end: 4399
      isolated-ui:
        command: ./scripts/spur-isolated-ui.sh
        autoStart: true
        ports:
          ui:
            env: SPUR_RESERVED_PORT_UI
            start: 5600
            end: 5699
            url: "https://{port}.${SPUR_SIDECAR_PUBLIC_HOST_SUFFIX}"
          terminal:
            env: SPUR_RESERVED_PORT_TERMINAL
            start: 15600
            end: 15699
        env:
          SPUR_SIDECAR_PUBLIC_HOST: "*.${SPUR_SIDECAR_PUBLIC_HOST_SUFFIX}"
          SPUR_SIDECAR_PUBLIC_URL: "https://{port}.${SPUR_SIDECAR_PUBLIC_HOST_SUFFIX}"
    spawn:
      steps:
        - "run $manager"
    sources:
      gh:
        type: github
      gh-pr-review:
        type: github
        intervalMs: 600000
        runOnStart: false
        emitExisting: true
        query: "repo:ashugaev/spur"
      # tg:
      #   type: telegram
      #   token: ${TELEGRAM_BOT_TOKEN}
      #   allowedUsers: [] # required, non-empty: Telegram user ids allowed to /watch
      #   allowedChats: [-1003768303388] # optional chat/group allowlist; literal ints only, no ${VAR}
    triggers:
      gh-changes-requested:
        source: gh
        event: github:changes_requested
        send:
          prompt: "Run $manager and $github. Address the latest requested review changes on the active PR."
      gh-ci-failed:
        source: gh
        event: github:ci_failed
        send:
          prompt: "Run $manager and $github. Check failing CI on the active PR, fix it, rerun relevant checks, then push."
      gh-comment:
        source: gh
        event: github:comment
        send:
          prompt: "/pr-comments-fix"
      gh-merge-conflict:
        source: gh
        event: github:merge_conflict
        send:
          prompt: "поправь конфликты и подпуш свежую ветку к себе и подпуш все."
      gh-pr-review-spawn:
        source: gh-pr-review
        event: github:work_item.new
        spawnDeskGroup: true
        spawn:
          restrictWrites: true
          allowedTriggers: []
          blocks:
            - agent: claude
              model: sonnet
              prompt: |
                Run /code-review {{url}}.
                Apply the `review` tag to this session.
                Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, CI, and merge state for {{url}}. If CI is failing or the PR has merge conflicts, find the running session working on this PR (spur list --json, match its pr link or PR binding to {{url}}, skip your own $SPUR_SESSION) and spur send it a concise ping describing the CI failure or merge conflict so the main agent fixes it."
              selfDestruct:
                enabled: true
                conditions: "PR is merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
              overrides:
                worktree: true
            - agent: cursor
              model: auto
              prompt: |
                Review PR {{url}} for correctness, bugs, and risky changes. Post concise findings as review comments.
                Apply the `review` tag to this session.
                Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, CI, and merge state for {{url}}. If CI is failing or the PR has merge conflicts, find the running session working on this PR (spur list --json, match its pr link or PR binding to {{url}}, skip your own $SPUR_SESSION) and spur send it a concise ping describing the CI failure or merge conflict so the main agent fixes it."
              selfDestruct:
                enabled: true
                conditions: "PR is merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
              overrides:
                worktree: true
            - agent: claude
              model: sonnet
              prompt: |
                Run end-to-end browser QA on GitHub PR {{url}}. First scope it: run `gh pr view {{url}}` and `gh pr diff {{url}}` to find the changed user-facing flows, then `gh pr checkout` the PR branch and bring the Spur web UI (packages/web) up with the `spur-sidecar` skill (isolated-ui sidecar). Then load and follow the `playwright-ui-runner` skill to drive the UI yourself with the Playwright MCP browser tools (navigate, click, type, snapshot, screenshot) — do NOT write or run automated test scripts; click through the changed flows by hand and analyze every screenshot visually, saving evidence to $SPUR_SESSION_ARTIFACTS_DIR. Running `gh pr checkout`, `git`, and the dev-server sidecar is expected and allowed — the restricted-writes notice only forbids editing source files, not checking out the branch or letting the dev server write build artifacts. When done, post a QA report as a PR comment via `gh pr comment` listing the cases you checked, pass/fail per case, and any problems found. Do not ask any questions and post the report without waiting for human confirmation. Do not edit application code.
                Apply the `review` tag to this session.
                Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, and merge state for {{url}}."
              selfDestruct:
                enabled: true
                conditions: "PR is merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
              overrides:
                worktree: true
      # PR lifecycle events on a github source:
      #   github:ready_for_review - PR left draft state
      #   github:approved         - an approving review (once per reviewer)
      #   github:merged           - PR merged
      #   github:closed           - PR closed without merging
      # Terminal events (merged/closed) fire only while the owning session still runs.
      gh-ready-for-review:
        source: gh
        event: github:ready_for_review
        send:
          prompt: "Run $manager and $github. The active PR is ready for review."
      # tg-message:
      #   source: tg
      #   event: telegram:message
      #   send:
      #     interrupt: false
