# Base dir for projects created without an explicit path. Unset falls back to <dataDir>/projects.
projectsRoot: ~/projects

projects:
  sp:
    path: ~/projects/spur
    defaultBranch: main
    sessionPrefix: spur
    defaultAgent: claude
    defaultModels:
      claude: opus
      cursor: composer-2.5
    symlinks:
      - .env
      - node_modules
      - v2/node_modules
    branchNaming:
      regex: "^feature/[a-z]+(-[a-z]+){0,3}$"
    workspaceAccess:
      items:
        - label: Cursor
          kind: copy
          value: "cursor --remote ssh-remote+${SPUR_SIDECAR_PUBLIC_HOST} ${worktreePathShell}"
        - label: Web IDE
          kind: link
          value: "${SPUR_VSCODE_WEB_URL}/?folder=${worktreePathUrl}"
    codexArgs:
      - -c
      - 'model_reasoning_effort="high"'
      - -c
      - 'service_tier="default"'
    preflight: {}
    sidecars:
      isolated-daemon:
        command: ./scripts/spur-isolated-daemon.sh
        autoStart: true
        ports:
          daemon:
            env: SPUR_RESERVED_PORT_DAEMON
            start: 4320
            end: 4399
      isolated-ui:
        command: ./scripts/spur-isolated-ui.sh
        autoStart: true
        dependsOn:
          - isolated-daemon
        ports:
          ui:
            env: SPUR_RESERVED_PORT_UI
            start: 5600
            end: 5699
            url: "https://{port}.${SPUR_SIDECAR_PUBLIC_HOST_SUFFIX}"
        env:
          SPUR_SIDECAR_PUBLIC_HOST: "*.${SPUR_SIDECAR_PUBLIC_HOST_SUFFIX}"
          SPUR_SIDECAR_PUBLIC_URL: "https://{port}.${SPUR_SIDECAR_PUBLIC_HOST_SUFFIX}"
    spawn:
      steps:
        - "run $manager"
    sources:
      gh:
        type: github
      gh-pr-review:
        type: github
        intervalMs: 600000
        runOnStart: false
        emitExisting: true
        query: "repo:ashugaev/spur"
      # tg:
      #   type: telegram
      #   token: ${TELEGRAM_BOT_TOKEN}
      #   allowedUsers: [] # required, non-empty: Telegram user ids allowed to /watch
      #   allowedChats: [-1003768303388] # optional chat/group allowlist; literal ints only, no ${VAR}
    triggers:
      gh-changes-requested:
        source: gh
        event: github:changes_requested
        send:
          prompt: "Run $manager and $github. Address requested changes on the active PR."
      gh-ci-failed:
        source: gh
        event: github:ci_failed
        send:
          prompt: "Run $manager and $github. Fix failing CI on the active PR — own change or another agent's — then rerun checks and push. If not fixable, say why."
      gh-comment:
        source: gh
        event: github:comment
        send:
          prompt: "/pr-comments-fix"
      gh-merge-conflict:
        source: gh
        event: github:merge_conflict
        send:
          prompt: "Resolve merge conflicts on the active PR. Rebase or merge fresh main into the branch. Push."
      gh-pr-review-spawn:
        source: gh-pr-review
        event: github:work_item.new
        spawnDeskGroup: true
        spawn:
          restrictWrites: true
          allowedTriggers: []
          blocks:
            - agent: claude
              model: sonnet
              prompt: |
                Run /code-review {{url}} --comment.
                Apply the `review` tag to this session.
                Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, CI, and merge state for {{url}}. If CI fails or the PR has merge conflicts, find the running session on this PR (spur list --json, match its pr link or PR binding to {{url}}, skip own $SPUR_SESSION) and spur send it a concise ping describing the CI failure or merge conflict."
              selfDestruct:
                enabled: true
                conditions: "PR merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
              overrides:
                worktree: true
            - agent: cursor
              model: composer-2.5
              prompt: |
                Review PR {{url}} for correctness, bugs, and risky changes. Post concise findings as review comments.
                Apply the `review` tag to this session.
                Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, CI, and merge state for {{url}}. If CI fails or the PR has merge conflicts, find the running session on this PR (spur list --json, match its pr link or PR binding to {{url}}, skip own $SPUR_SESSION) and spur send it a concise ping describing the CI failure or merge conflict."
              selfDestruct:
                enabled: true
                conditions: "PR merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
              overrides:
                worktree: true
            - agent: claude
              model: sonnet
              prompt: |
                Run end-to-end browser QA on GitHub PR {{url}}. Scope it: `gh pr view {{url}}` and `gh pr diff {{url}}` for changed user-facing flows. `gh pr checkout` the PR branch and bring up the Spur web UI (packages/web) with the `spur-sidecar` skill (isolated-ui sidecar). Load and follow the `playwright-ui-runner` skill to drive the UI yourself with the Playwright MCP browser tools (navigate, click, type, snapshot, screenshot) — do NOT write or run automated test scripts; click through the changed flows by hand, analyze every screenshot visually, save evidence to $SPUR_SESSION_ARTIFACTS_DIR. `gh pr checkout`, `git`, and dev-server sidecar writes are allowed — the restricted-writes notice forbids editing source files only, not checking out the branch or the dev server writing build artifacts. Post a QA report as a PR comment via `gh pr comment`: cases checked, pass/fail per case, problems found. No questions. Post without waiting for human confirmation. Do not edit application code.
                Apply the `review` tag to this session.
                Schedule a recurring wake: spur wake "$SPUR_SESSION" --every 12h --until "self-destruct conditions are satisfied" "Recheck latest PR comments, review status, and merge state for {{url}}."
              selfDestruct:
                enabled: true
                conditions: "PR merged and no actionable comments or review requests remain after checking latest comments, review status, and merge state."
              overrides:
                worktree: true
            - agent: claude
              model: sonnet
              prompt: |
                Docs-only review of PR {{url}}. Load the `docs` skill and judge the diff against its checklist, nothing else.
                Flag only Spur-specific doc defects: a new command, flag, config field, source, provider, or event shipped without a doc update; content duplicated instead of linked to its one owner; a wrong command, port, path, or package name; a dead relative link; a doc in the wrong file or Diataxis mode.
                Ignore prose style, grammar, and anything a competent dev or agent already knows. If the docs are clean, post nothing.
                Post findings as one concise PR comment via `gh pr comment`. Do not edit files, ask questions, or wait for confirmation.
                Apply the `review` tag to this session.
              selfDestruct:
                enabled: true
                conditions: "docs review posted, or PR changes no docs and no user-facing surface."
              overrides:
                worktree: true
      # PR lifecycle events on a github source:
      #   github:ready_for_review - PR left draft state
      #   github:approved         - an approving review (once per reviewer)
      #   github:merged           - PR merged
      #   github:closed           - PR closed without merging
      # Terminal events (merged/closed) fire only while the owning session still runs.
      gh-ready-for-review:
        source: gh
        event: github:ready_for_review
        send:
          prompt: "Run $manager and $github. Active PR is ready for review."
