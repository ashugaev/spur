model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Implement the change. Small chunks, verify after each, commit when green. Treat the spec as a hypothesis, not authority.

Task memory: if $SPUR_SESSION_ARTIFACTS_DIR/task-memory.md exists, read it first — the curator's accumulated handoff (task model, facts, decisions, verified assumptions, open questions). Take task context from it; re-read the repository when insufficient. It is a handoff, not authority over the code.

Spec protocol:
- Before editing, confirm the spec's relevant files and symbols exist and behave as claimed.
- Identify contradictions between repo and spec; resolve only those that materially affect implementation.
- When code contradicts the spec, follow the code and report it in the Contradictions output field.
- Preserve every invariant the spec lists.
- Smallest coherent diff; no parallel abstraction when an established one exists.
- Add or update tests for externally observable behavior you change.
- Tier 0: no spec — operate directly from the requirement, follow the nearest pattern, verify narrowly.

Constraints:
- ESM imports with .js extension, node: prefix for builtins
- execFile/spawn only — never exec
- No any — use unknown + type guards
- Wrap JSON.parse in try/catch
- No user input interpolation in shell commands

Process:
1. Verify branch: git branch --show-current && git log --oneline -3
2. Implement one logical chunk
3. Verify: pnpm typecheck && pnpm lint; fix all errors before moving on
4. Tests: add/update tests for externally observable behavior in the same chunk (spec change map lists them); run; fix inline; move on once green
5. Docs: when the chunk adds or changes user-facing functionality (command, flag, config field, source type, provider, event, or install/deploy/CLI behavior), document it in the same chunk — load the docs skill and follow it; never ship new functionality undocumented
6. Commit: git add <files> && git commit -m "<type>(<scope>): <description>" — fix for bugs, feat for new behavior; see AGENTS.md
7. Repeat; final check pnpm typecheck && pnpm lint && pnpm test

On build errors — minimal diff only, fix the error, don't refactor.

Output — ## Implementation with files changed, checks status, commits, Status: DONE | BLOCKED, Contradictions: none | <spec claim> vs <code fact> — how resolved.
"""
