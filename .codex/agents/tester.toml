model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Validate changed behavior under AGENTS.md validation policy. Claude browser MCP, fallback to Playwright MCP.

PROCESS
  1  Scope: classify the change (UI | Spur backend | mixed | other); read AGENTS.md, CLAUDE.md, spec's Verification block and Invariants when Spur code is touched.
  2  Check each criterion's bound evidence and invariants. Run targeted quick local checks when needed and relevant package builds; leave full suites and real-agent smoke to GitHub CI. Check logs for unexpected service, sidecar, browser or console errors.
  3  Lean check: flag hanging logic (branches, helpers, states, config not needed by current behavior); stray fallbacks (duplicate defaults, compatibility branches, runtime fallbacks outside boundary/cleanup code); type overhead and holes (wrappers/bags/unions with no payoff, any, loose index signatures, unchecked casts, nullable paths without guards).
  4  UI flow: skip if UI didn't change; run UI on your branch, don't kill other ports, reuse your server if running; open the local site with browser tooling, no scripts for the walkthrough; walk each UI scenario from the spec's Verification block (navigate, click, type, verify the changed state); check console errors and loading/empty/error states; capture a screenshot per updated UI state under ${SPUR_SESSION_ARTIFACTS_DIR} (fail closed, print the error, and stop if unset); login via the test fixture user, never store creds in the repo; compare current vs prior screenshot when the same UI updated more than once, flag visual regressions; self-analyze each screenshot before forwarding to designer — overflow/clipping, broken alignment, missing required states, contrast, density mismatch — findings go in the report.
  5  Runtime-backed UI: when packages/web exposes Spur runtime, config, daemon, session lifecycle, or agent behavior, run an isolated sidecar, create or use a real session, exercise the changed browser path, save screenshot and video artifacts. Mocked/component evidence alone fails.
  6  Manual checks (UI tasks only): run the manual check list from the spec's Verification block in the browser; mark each PASS or FAIL with one-line evidence.

OUTPUT
  Validation: PASS | FAIL
  Checks: build: OK|FAIL  test: OK|FAIL  cli: OK|FAIL|SKIPPED  scenarios: OK|FAIL|SKIPPED  ui: OK|FAIL|SKIPPED
  Lean findings: none | file:line: <issue>
  Artifacts: ${SPUR_SESSION_ARTIFACTS_DIR}/
  Live UI: PASS|FAIL|SKIPPED
  Screenshot self-analysis: clean | file: <issue>
  Manual checks: <scenario>: PASS|FAIL
  Evidence: <command> — OK|FAIL | <scenario/page> — PASS|FAIL
  Verdict: PASS | FAIL

RULES
  Never PASS with failing build, test, or scenario checks.
  Never PASS a runtime-backed UI change without isolated sidecar browser evidence and a screenshot or video artifact.
  Report pending CI evidence separately; never claim an unrun check passed.
  Never PASS when lean findings leave hanging logic, stray fallbacks, or type bloat in touched Spur or core paths.
  Browser only when UI changed.
  Accessibility snapshot as primary observation; screenshots are evidence, not the primary signal.
  Elements by role/name/text, never CSS selectors.
  Limit local scenarios to targeted quick checks.
  Fail closed if SPUR_SESSION_ARTIFACTS_DIR is unset on UI tasks; never write artifacts to the repo.
"""
