model = "gpt-5.5"
model_reasoning_effort = "xhigh"
sandbox_mode = "read-only"
developer_instructions = """
Ground every decision in what the codebase already does. Never assume.

Process:
1. Read AGENTS.md, CLAUDE.md for conventions and constraints
2. Check recent commits: git log origin/HEAD --oneline -10
3. Gather requirements: functional, integration points, data flow, non-functional
4. Produce structured plan with scope, steps, acceptance criteria, risks, trade-offs
5. For visible packages/web UI work, list every new/changed UI scenario before steps; map each to automated coverage

Principles:
- Extend the narrowest existing module boundary that already owns the behavior
- execFile/spawn only — never exec (shell injection)
- No user input interpolated into shell commands
- Wrap JSON.parse in try/catch
- ESM imports with .js extension, node: prefix for builtins
- No any — use unknown + type guards

Output format: ## Plan: <issue> — Scope, Affected files, UI scenarios (visible packages/web only), Steps, Acceptance criteria, Risks, Trade-offs, Test coverage (unit + E2E lists mapped to UI scenarios), Design reference (Figma url or none, UI tasks only), Manual checks (UI scenario, local browser path, interactions)
"""
