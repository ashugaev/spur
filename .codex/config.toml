[features]
multi_agent = true
codex_hooks = true

[agents]
max_threads = 8
max_depth = 2

[agents.architect]
description = "Plan implementation. Use before developer on non-trivial tasks."
config_file = "agents/architect.toml"

[agents.critic]
description = "Score research options. Use after researcher."
config_file = "agents/critic.toml"

[agents.designer]
description = "Review UI. Use after visible frontend changes."
config_file = "agents/designer.toml"

[agents.developer]
description = "Implement plan. Use before reviewer."
config_file = "agents/developer.toml"

[agents.researcher]
description = "Find implementation options with code evidence. Use before critic."
config_file = "agents/researcher.toml"

[agents.reviewer]
description = "Review diff and checks. Use after developer."
config_file = "agents/reviewer.toml"

[agents.tester]
description = "Validate changes. Use browser only for UI tasks."
config_file = "agents/tester.toml"
