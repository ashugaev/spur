[features]
multi_agent = true
hooks = true

[agents]
max_threads = 8
max_depth = 2

[agents.architect]
description = "Produce an executable spec after repo recon — findings, change map, invariants, acceptance criteria bound to verification. Use before developer on tier 1+ tasks."
config_file = "agents/architect.toml"

[agents.critic]
description = "Adversarially falsify the researcher's options and its facts/inference split, score each, select the winner. Use after researcher, before architect."
config_file = "agents/critic.toml"

[agents.curator]
description = "Maintain the task's append-only structured memory and refresh the compact handoff between gates. Use on longer multi-cycle Tier 2/3 tasks. Appends facts and reflection; never re-summarizes."
config_file = "agents/curator.toml"

[agents.designer]
description = "UI review gate. Verify layout, visual consistency, and UI states for frontend changes. Use after UI implementation. Skip backend-only changes."
config_file = "agents/designer.toml"

[agents.design-author]
description = "Author and export a UI design before implementation. Use when a task introduces or changes visible packages/web UI. Produces a Claude Design update, a runtime-neutral export, and a design-spec for approval. Claude runtime only."
config_file = "agents/design-author.toml"

[agents.developer]
description = "Implement against the spec, treating it as a hypothesis to verify against code. Writes code, runs checks, commits focused changes. Use after architect, before reviewer."
config_file = "agents/developer.toml"

[agents.researcher]
description = "Generate 2-3 implementation approaches with codebase evidence, splitting verified facts from inferences. Use before critic."
config_file = "agents/researcher.toml"

[agents.reference-researcher]
description = "Extract reusable patterns from external reference repos. Use when source code outside this repo must inform Spur design."
config_file = "agents/reference-researcher.toml"

[agents.reviewer]
description = "Adversarial review gate. Try to falsify that the implementation satisfies each acceptance criterion. Static diff analysis + build checks. Returns APPROVED or CHANGES_REQUESTED. Use after developer."
config_file = "agents/reviewer.toml"

[agents.spec-critic]
description = "Adversarially falsify the architect's executable spec before the developer builds — verify each cited fact, the change map, and every acceptance criterion's bound verification. Returns SPEC_APPROVED, SPEC_CHANGES_REQUESTED, or SPEC_REJECTED. Use after architect, before developer. Skip Tier 0, which produces no spec."
config_file = "agents/spec-critic.toml"

[agents.tester]
description = "Validation gate. Runs targeted checks, Spur CLI validation, builds, and a lean Spur code check. Uses browser only for UI tasks. Returns PASS or FAIL."
config_file = "agents/tester.toml"
