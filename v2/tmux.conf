# Ctrl+G - detach from tmux (back to Spur list)
bind -n C-g detach-client

# No status bar — session title is shown in the Spur UI, not tmux
set -g status off

# Enable mouse support for scrolling and selection
set -g mouse on

# Better scrolling: enter copy mode automatically on scroll-up
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
